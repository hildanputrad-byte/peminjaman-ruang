<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-form {
            max-width: 300px;
            width: 100%;
            padding: 1em;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 1em;
        }

        .login-form label {
            display: block;
            margin-bottom: 0.5em;
        }

        .login-form input {
            width: 100%;
            padding: 0.5em;
            margin-top: 0.2em;
            box-sizing: border-box;
        }

        .login-form button {
            width: 100%;
            padding: 0.5em;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <form class="login-form" method="POST" action="/login">
        <h2>Login</h2>
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Login</button>
    </form>
</body>

</html>
